<!DOCTYPE html>

<meta charset="utf-8">

<title>XGalaga: Hyperspace</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #xgalcanvas {
    /* 1px grey frame: keeps the game screen's edges identifiable against
     * the black browser window. */
    border: 1px solid #808080;
    /* sized in whole pixels by the fitCanvas() script below */
    image-rendering: pixelated;
    cursor: crosshair;
  }
  #xgal-links {
    margin-top: 8px;
    display: flex;
    gap: 16px;
    align-items: center;
    color: #777;
    font: 13px monospace;
  }
  #xgal-links a {
    color: #777;
    text-decoration: none;
  }
  #xgal-links a:hover {
    color: #fff;
  }
  #xgal-links svg {
    fill: #777;
    display: inline-block;
    vertical-align: -0.3em;
    margin-left: 4px;
  }
  #xgal-links a > svg:first-child {
    margin-left: 0;
  }
  #xgal-links a > span {
    margin-left: 4px;
  }
  #xgal-links svg.stroke {
    fill: none;
    stroke: #777;
    stroke-width: 1.6;
  }
  #xgal-links a:hover svg {
    fill: #fff;
  }
  #xgal-links a:hover svg.stroke {
    fill: none;
    stroke: #fff;
  }
  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 4px;
    text-align: center;
    color: #f00;
    font: 14px monospace;
    display: none;
  }
</style>
</head>

<canvas id="xgalcanvas" width="468" height="596"></canvas>

<script>
  /* Integer (whole-pixel) scaling: crisp retro pixels instead of blurry
   * fractional stretching.  Falls back to a fractional scale when the
   * window is smaller than the 468x596 game screen. */
  function fitCanvas() {
    var c = document.getElementById("xgalcanvas");
    var bw = 2; /* 1px border on each side */
    /* Space used by non-canvas page chrome (links row), plus the debug
     * panel's width when it is on the side. */
    var chrome = 0;
    var links = document.getElementById("xgal-links");
    if (links && links.offsetHeight)
      chrome += links.offsetHeight + 8; /* margin-top */
    var side = 0;
    var dbg = document.getElementById("xgal-debug");
    if (dbg && dbg.offsetWidth)
      side = dbg.offsetWidth + 16; /* panel + its left margin */
    var s = Math.min((window.innerWidth - bw - side) / c.width,
                     (window.innerHeight - bw - chrome) / c.height);
    var whole = Math.floor(s);
    s = whole >= 1 ? whole : s;
    c.style.width = Math.round(c.width * s) + "px";
    c.style.height = Math.round(c.height * s) + "px";
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();
</script>

<script>
  /* Point the game at a leaderboard API on another origin if it is not
   * served alongside the game (default: same-origin /scores). */
  // window.XGAL_LEADERBOARD_URL = "http://localhost:8088";
  /* Debug panel (debug_webui.js): in-browser game-state readouts and
   * controls (start level, weapon, torps, ships, shields, speed, pause).
   * The panel exists only in bundles built with XGAL_DEBUG_PANEL=true
   * (see build.sh); in such a bundle, enable it with either of the two
   * below (otherwise the page behaves exactly as without the panel):
   *   1) uncomment:  window.XGAL_DEBUG_WEBUI = true;
   *   2) open the page with ?debug in the URL
   */
  // window.XGAL_DEBUG_WEBUI = true;
  var Module = {
    canvas: document.getElementById("xgalcanvas"),
    print: function (t) { console.log(t); },
    printErr: function (t) {
      console.error(t);
      var s = document.getElementById("status");
      s.style.display = "block";
      s.textContent = t;
    }
  };
  window.addEventListener("error", function (e) {
    var s = document.getElementById("status");
    s.style.display = "block";
    s.textContent = "Error: " + (e.message || e.error);
  });
</script>
