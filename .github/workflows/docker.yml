# Build the game + leaderboard image and push it to the GitHub Container
# Registry on every push to main.  Resulting image:
#
#   ghcr.io/swishkin/xgalaga-hyperspace-web:latest   (also tagged with the commit sha)
#
# Requires (one-time, already set in repo settings): Settings → Actions →
# Workflow permissions → "Allow GitHub Actions to read and write packages".
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image ships the committed web/xgalaga.js (the image build has
      # no emsdk), so refuse to publish an image whose bundle is older
      # than the sources it is built from.
      - name: Check that the game bundle is up to date
        run: .github/scripts/check-bundle-freshness.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
