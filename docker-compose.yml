# XGalaga: Hyperspace — game + shared high-score leaderboard.
#
#   cp .env.example .env        # first time only (knobs for leaderboard.py)
#   docker compose up -d        # build (first time) and start on :8088
#   # play: http://localhost:8088/
#
# All leaderboard.py knobs go in .env (loaded via env_file); the defaults
# are in .env.example / the leaderboard.py docstring.
#
# Scores persist in the ./data bind mount (must be writable by uid 65534,
# the 'nobody' user the container runs as; `chmod 777 data` works locally).
services:
  xgalaga:
    build: .
    image: xgalaga-hyperspace:latest
    container_name: xgalaga-hyperspace-web
    ports:
      - "8088:8088"          # host:container — change the left side to rebind
    env_file: .env
    volumes:
      - ./data:/data         # persist scores.json across updates/restarts
    restart: unless-stopped
